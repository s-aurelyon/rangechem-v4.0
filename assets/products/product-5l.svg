<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Jerry Can Body Gradient -->
    <linearGradient id="bodyGrad5L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    
    <!-- Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b02519" />
      <stop offset="35%" stop-color="#d63121" />
      <stop offset="85%" stop-color="#b02519" />
      <stop offset="100%" stop-color="#8c1b11" />
    </linearGradient>

    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-2" dy="12" stdDeviation="20" flood-color="#141414" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Shadow -->
  <ellipse cx="200" cy="465" rx="140" ry="25" fill="#141414" opacity="0.18" filter="url(#shadow-lg)" />

  <!-- 5L Jerry Can Body -->
  <g filter="url(#shadow-lg)">
    <path d="M70,160
             C70,140 85,130 100,130
             L140,130
             C150,130 155,120 160,105
             L180,65
             C185,55 195,50 205,50
             L310,50
             C330,50 340,65 340,85
             L340,435
             C340,455 330,465 310,465
             L90,465
             C70,465 60,455 60,435
             Z" 
          fill="url(#bodyGrad5L)" stroke="#d1d5db" stroke-width="2" />
  </g>

  <!-- Handle Cutout (Negative Space) -->
  <path d="M110,145
           C110,135 120,128 135,128
           L165,128
           C180,128 190,135 190,145
           L190,200
           C190,210 180,218 165,218
           L135,218
           C120,218 110,210 110,200
           Z" 
        fill="#ffffff" stroke="#d1d5db" stroke-width="2" filter="url(#shadow-lg)"/>
  
  <!-- Handle shadow/depth -->
  <path d="M110,145 C110,135 120,128 135,128 L165,128 C180,128 190,135 190,145 L190,200 C190,210 180,218 165,218 L135,218 C120,218 110,210 110,200 Z" fill="#141414" opacity="0.04" />

  <!-- Embossed Ribs -->
  <rect x="80" y="250" width="20" height="180" rx="10" fill="#e5e7eb" opacity="0.6" />
  <rect x="300" y="250" width="20" height="180" rx="10" fill="#e5e7eb" opacity="0.6" />

  <!-- Neck Rings -->
  <rect x="235" y="45" width="60" height="6" rx="3" fill="#d1d5db" />
  
  <!-- Cap -->
  <g filter="url(#shadow-lg)">
    <path d="M230,15 L300,15 C305,15 308,18 308,24 L308,45 L222,45 L222,24 C222,18 225,15 230,15 Z" fill="url(#capGrad)" />
    <!-- Cap Details -->
    <rect x="228" y="20" width="6" height="25" fill="#ffffff" opacity="0.15" />
    <rect x="242" y="20" width="6" height="25" fill="#ffffff" opacity="0.15" />
    <rect x="256" y="20" width="6" height="25" fill="#ffffff" opacity="0.15" />
    <rect x="270" y="20" width="6" height="25" fill="#ffffff" opacity="0.15" />
    <rect x="284" y="20" width="6" height="25" fill="#ffffff" opacity="0.15" />
    <rect x="296" y="20" width="6" height="25" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Large Label -->
  <g>
    <rect x="115" y="245" width="170" height="190" rx="4" fill="#ffffff" filter="url(#shadow-lg)" />
    
    <!-- Top Block -->
    <path d="M115,249 C115,246.8 116.8,245 119,245 L281,245 C283.2,245 285,246.8 285,249 L285,285 L115,285 Z" fill="#141414" />
    <text x="200" y="272" font-family="Montserrat, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">5 LITERS</text>
    
    <!-- Label Details -->
    <rect x="135" y="305" width="100" height="10" rx="5" fill="#6b7280" />
    <rect x="135" y="325" width="130" height="4" rx="2" fill="#d1d5db" />
    <rect x="135" y="337" width="115" height="4" rx="2" fill="#d1d5db" />
    <rect x="135" y="349" width="125" height="4" rx="2" fill="#d1d5db" />
    <rect x="135" y="361" width="105" height="4" rx="2" fill="#d1d5db" />
    <rect x="135" y="373" width="110" height="4" rx="2" fill="#d1d5db" />
    
    <!-- Heavy Duty Industrial Badges -->
    <circle cx="155" cy="405" r="14" fill="#d63121" opacity="0.9" />
    <circle cx="190" cy="405" r="14" fill="#141414" opacity="0.8" />
    
    <!-- Barcode Box -->
    <rect x="235" y="380" width="35" height="40" fill="#111827" opacity="0.9" />
  </g>
  
  <!-- Highlight / Plastic Reflection -->
  <path d="M85,160 C85,140 95,132 105,132 L145,132 C135,160 115,350 115,445 C80,435 85,200 85,160 Z" fill="#ffffff" opacity="0.5" />
</svg>
